<!-- OPINIONES -->
<section class="bg-white text-gray-600 py-20 px-6">

        Valóranos en Google

    </div>
    <div class="flex-1 overflow-hidden">
      <div id="carrusel" class="flex gap-6 transition-transform duration-700"></div>
    </div>
  </div>

<script>
const placeId = "ChIJoajCmdSBn5URXVK3LJmgrB8";
const apiKey = "AIzaSyC0c9rMsP6VGOIRpovAvDxOY63fa-Ndj00";

fetch(`https://places.googleapis.com/v1/places/${placeId}?fields=rating,userRatingCount,reviews`,{
  headers:{
    "X-Goog-Api-Key": apiKey,
    "X-Goog-FieldMask": "rating,userRatingCount,reviews"
  }
})
.then(r=>r.json())
.then(d=>{
  document.getElementById("valoracion").innerHTML =
    `⭐ ${d.rating} / 5 (${d.userRatingCount} opiniones)`;
  const carrusel = document.getElementById("carrusel");
  d.reviews.filter(r=>r.rating===5).slice(0,5).forEach(r=>{
    carrusel.innerHTML += `
      <div class="bg-gray-100 p-4 rounded-xl w-72 shrink-0">
        <strong>${r.authorAttribution.displayName}</strong>
        <p class="mt-2 text-sm line-clamp-4">${r.text.text}</p>
      </div>`;
  });
});
</script>
