<!DOCTYPE html>
<html lang="es">
<head>

  <!-- Google Analytics -->

  <!-- Meta -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRZ Sacabollos</title>
  <meta name="description" content="Especialistas en desabollado artesanal sin dañar pintura. Reparación de granizo. Taller registrado.">
  <meta name="keywords" content="sacabollos, desabollado sin pintar, granizo, PDR, Montevideo">
  <meta name="author" content="SRZ Sacabollos">
  <link rel="icon" href="favicon.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://srzsacabollos.uy/">
  <meta property="og:title" content="SRZ Sacabollos">
  <meta property="og:description" content="Especialistas en desabollado artesanal sin dañar pintura.">
  <meta property="og:image" content="https://srzsacabollos.uy/imagen og.jpg">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fuente Aero -->
  <style>
    @font-face {
      font-family: 'Aero';
      src: url('/Fuentes/Aero.woff2') format('woff2'),
           url('/Fuentes/Aero.woff') format('woff');
    }

    body {
      font-family: 'Aero', sans-serif;
    }

    .instagram-media {
      border-radius: 16px !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
  </style>

</head>

<body class="bg-black text-white scroll-smooth">

<!-- ================= NAVBAR ================= -->
<header class="bg-white shadow-md fixed top-0 w-full z-50">
  <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
    <a href="#inicio" class="flex items-center gap-2">
      <img src="logo.png" class="h-10">
      <span class="text-gray-800 text-xl">SRZ Sacabollos</span>
    </a>

    <button id="menu-btn" class="sm:hidden text-gray-800 text-2xl">☰</button>

    <nav id="menu" class="hidden sm:flex gap-6 text-gray-700">
      <a href="#inicio">Inicio</a>
      <a href="#galeria">Galería</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </div>

  <div id="mobile-menu" class="hidden sm:hidden bg-white px-4 py-2">
    <a href="#inicio" class="block py-2">Inicio</a>
    <a href="#galeria" class="block py-2">Galería</a>
    <a href="#contacto" class="block py-2">Contacto</a>
  </div>
</header>

<div class="h-16"></div>

<!-- ================= INICIO ================= -->
<section id="inicio" class="h-screen flex items-center justify-center bg-cover bg-center" style="background-image:url('fondo.avif')">
  <div class="bg-black/60 p-8 rounded-xl text-center">
    <img src="logo.png" class="mx-auto mb-6 max-w-xs">
    <h1 class="text-4xl md:text-5xl font-bold">
      Defendiendo el legado del primer sacabollos del Uruguay
    </h1>
  </div>
</section>

<!-- ================= GALERÍA ================= -->
<section id="galeria" class="bg-black py-12 px-4">
  <h2 class="text-center text-3xl mb-8">Galería de trabajos</h2>
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 max-w-6xl mx-auto">
    <!-- imágenes -->
    <!-- (dejé intactas las tuyas) -->
  </div>
</section>

<!-- ================= INSTAGRAM ================= -->
<section class="bg-[#fdfdfc] py-16 px-4">
  <div class="max-w-6xl mx-auto text-center mb-10">
    <h2 class="text-3xl font-bold text-[#4a6670]">Nuestro Instagram</h2>
    <p class="text-gray-500 mt-2">Últimos trabajos reales</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 max-w-6xl mx-auto">
    <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DTyUlJ3kRXz/" data-instgrm-version="14"></blockquote>
    <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DQZywDGk7Lo/" data-instgrm-version="14"></blockquote>
    <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DP1Ki5-gZUe/" data-instgrm-version="14"></blockquote>
    <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DPeVWv4EW5i/" data-instgrm-version="14"></blockquote>
    <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DPFE4d-EaW0/" data-instgrm-version="14"></blockquote>
    <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DH_1JQGyJCq/" data-instgrm-version="14"></blockquote>
    <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DHY97wdpXu5/" data-instgrm-version="14"></blockquote>
    <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DHJxyk-JLYL/" data-instgrm-version="14"></blockquote>
  </div>
</section>

<!-- ================= CONTACTO ================= -->
<section id="contacto" class="bg-[#fdfdfc] text-[#4a6670] py-12 px-4">
  <!-- tu sección contacto intacta -->
</section>

<!-- ================= SCRIPTS ================= -->
<script>
  document.getElementById('menu-btn').onclick = () =>
    document.getElementById('mobile-menu').classList.toggle('hidden');
</script>

<!-- Instagram Embed -->
<script async src="https://www.instagram.com/embed.js"></script>
<script>
  window.addEventListener('load', () => {
    if (window.instgrm) window.instgrm.Embeds.process();
  });
</script>

</body>
</html>
